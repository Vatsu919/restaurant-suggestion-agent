spring.application.name=restaurant-suggestion-agent

# API keys: environment variables, or KEY=value lines in a .env file in the folder the app
# is started from (the project root). Environment variables win if both are set.
# .env is listed in .gitignore; never put keys in this file.
spring.config.import=optional:file:.env[.properties]

# LLM used by every step (the cheapest current model); the API key comes from the ANTHROPIC_API_KEY environment variable
agent.llm.model=claude-haiku-5-5
agent.max-concurrent-runs=4
# LLM calls made at the same time (one per menu); kept low to stay within API rate limits
agent.llm.parallel-calls=4

# Google Places; the API key comes from the GOOGLE_MAPS_KEY environment variable.
# One search covers all requested meals. Results bound how many restaurants the later steps (crawling, LLM calls) process.
places.max-results=20

# Filter: restaurants below these are skipped as LOW_RATING
filter.min-rating=3.0
filter.min-review-count=20
# Typical European meal hours (local time). Opening hours outside these only add a note, never a skip.
filter.meal-hours.breakfast=07:00-11:00
filter.meal-hours.lunch=12:00-15:00
filter.meal-hours.dinner=18:00-22:00

# Menu lookup on restaurant websites
menu.parallel-restaurants=6
menu.max-fetches-per-restaurant=8
menu.max-download-mb=15
menu.request-timeout-seconds=20

# Menu reading: text is extracted in Java, then read by the LLM (agent.llm.model)
# Longer menu text is cut to this length; the event says when that happened
extract.max-menu-chars=40000

# Ranking: default weights of the six dimensions (percent; scaled to sum to 100%).
# They adapt per request: a dimension the request gives nothing to judge by (no budget, no diet)
# gets 0, and what the user says matters most counts rank.priority-boost times as much.
# Each bad sign (a 1-2 star review, a red flag such as hygiene, old reviews) takes 5 points off.
rank.weight.food-match=20
rank.weight.dietary-match=20
rank.weight.price-match=15
rank.weight.rating=10
rank.weight.positive-reviews=10
rank.weight.context-reviews=20
rank.priority-boost=2

# Final answer: how many top-ranked restaurants are written up (one LLM call for all), and dishes shown for each
answer.top-restaurants=5
answer.dishes-per-restaurant=8
